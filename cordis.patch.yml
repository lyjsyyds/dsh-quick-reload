# dsh-quick-reload bundle layer — registers the HOST half into a profile.
#
# The BROWSER half needs no row here: the module loader auto-discovers the
# client bundle from package.json `exports["./client"]` + `dsh.client`.
#
# PITFALL: `name` is a PACKAGE NAME (resolved via the profile's node_modules),
# NOT a relative path.
#
# Install (run from the workspace that holds this directory):
#   dsh plugin --profile desktop add link:C:\Users\99610\Documents\deepseek-harness\default-workspace\dsh-quick-reload
#
# Or, without a shell: Settings → Plugins → 安装, with that absolute directory
# path as the spec. The Plugin Manager performs the pnpm install and the bundle
# selection itself.
- insert:
    - id: quick-reload
      name: dsh-quick-reload-lyjs
